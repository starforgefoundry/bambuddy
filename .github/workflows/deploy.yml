name: Deploy

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  INFRA_REPO: starforgefoundry/infra
  HELM_RELEASE: kubernetes/apps/shop/printing/bambuddy/app/helmrelease.yaml
  IMAGE: ghcr.io/starforgefoundry/bambuddy
  VERSION: ${{ inputs.version }}

jobs:
  bump-infra:
    name: Bump bambuddy image in infra
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.STARFORGEBOT_APP_ID }}
          private-key: ${{ secrets.STARFORGEBOT_PRIVATE_KEY }}
          repositories: infra

      - name: Checkout infra
        uses: actions/checkout@v6
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Update image tag
        run: |
          sed -i -E "\#repository: ${IMAGE}\$#{n;s/tag: .*/tag: '${VERSION}'/;}" "$HELM_RELEASE"
          grep -A1 "repository: ${IMAGE}" "$HELM_RELEASE"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          if git diff --quiet; then
            echo "bambuddy is already at ${VERSION}"
            exit 0
          fi

          BOT_ID=$(gh api "/users/${BOT_LOGIN}" --jq .id)
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"

          git commit -am "chore(bambuddy): update image to ${VERSION}"
          git pull --rebase
          git push
